<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CPV SIGNAL PRIVATE LINK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
      padding: 30px;
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
    }

    h1 {
      color: red;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #222;
      color: white;
      text-align: center;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .activate {
      background: red;
      color: white;
    }

    .get-code {
      background: white;
      color: black;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 CPV PRIVATE LINK</h1>

    <div class="subtitle">
      Enter your activation code to continue
    </div>

    <input
      type="text"
      id="activationCode"
      placeholder="Enter activation code"
      autocomplete="off"
    >

    <button
      class="activate"
      onclick="activate()">
      ACTIVATE
    </button>

    <button
      class="get-code"
      onclick="getActivationCode()">
      GET ACTIVATION CODE
    </button>

    <div id="message"></div>

  </div>

  <script>

    function activate() {

      const code =
        document.getElementById("activationCode").value.trim();

      const message =
        document.getElementById("message");

      if (code === "") {

        message.textContent =
          "Please enter your activation code.";

        message.style.color = "orange";

        return;
      }

      message.textContent =
        "Invalid activation code.";

      message.style.color = "red";
    }


    function getActivationCode() {

      window.location.href =
        "https://signal.org/";
    }

  </script>

</body>
</html>
